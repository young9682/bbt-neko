# 猫娘 LoRA 微调配置（LLaMA-Factory），配合 train/volcano-sft.yaml 使用
# 数据 = 85% 猫娘语料 + 15% 通用指令（防灾难性遗忘）
# 1h 时限对策：save_steps 每 100 步存盘到 PVC；run_sft.sh 自动从最新 checkpoint 续跑

### 模型
model_name_or_path: /workspace/datasets/Qwen3-8B
trust_remote_code: true

### 方法
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05

### 数据
dataset_dir: /workspace/repos/bbt-neko/train
dataset: neko_sft,neko_general
template: qwen3
cutoff_len: 2048
mix_strategy: interleave_under
interleave_probs: "0.85,0.15"

### 训练
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true

### 输出与保存（checkpoint 必须落 PVC，绝不存容器 /tmp）
output_dir: /workspace/checkpoints/neko-lora-v1
save_steps: 100
save_total_limit: 3
logging_steps: 10
plot_loss: true

### 验证
val_size: 0.02
eval_strategy: steps
eval_steps: 100
per_device_eval_batch_size: 4
